name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Supersede a still-running check when a branch is pushed again. Dependabot
# rebases its pull requests whenever main moves, and without this every rebase
# leaves the previous run burning minutes and reporting a stale result against
# the branch. Runs on main are never cancelled: they publish images and feed
# the code scanning baseline, so they have to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.26'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        # Resolve GO_VERSION to the newest matching patch release instead of
        # whatever the runner image happens to have cached. Without this the
        # job builds against a stale toolchain and govulncheck reports standard
        # library advisories that are already fixed upstream.
        check-latest: true

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=5m

  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        # Resolve GO_VERSION to the newest matching patch release instead of
        # whatever the runner image happens to have cached. Without this the
        # job builds against a stale toolchain and govulncheck reports standard
        # library advisories that are already fixed upstream.
        check-latest: true

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      run: govulncheck ./...

  staticcheck:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        # Resolve GO_VERSION to the newest matching patch release instead of
        # whatever the runner image happens to have cached. Without this the
        # job builds against a stale toolchain and govulncheck reports standard
        # library advisories that are already fixed upstream.
        check-latest: true

    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Run staticcheck
      run: staticcheck ./...

  license-check:
    name: License Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: FOSSA Scan
      uses: fossas/fossa-action@main
      with:
        api-key: ${{ secrets.FOSSA_API_KEY }}
      continue-on-error: true  # Don't fail if FOSSA key not available
